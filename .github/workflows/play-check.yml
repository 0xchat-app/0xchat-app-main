# TEMPORARY: validates Play publishing end to end without publishing anything.
#
#   check    - read-only probe of API access; opens an edit and discards it
#   dry-run  - builds a signed AAB and runs the full upload path, then throws
#              the edit away, so Play validates the bundle but no release is
#              created and no version code is consumed
#
# Delete this workflow once the real publishing job is in place.
name: Play API check

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/play-publishing'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      - name: Probe Play API
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python .github/scripts/play_api_check.py

  dry-run:
    needs: check
    runs-on: ubuntu-22.04
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK
        run: |
          sdk="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null 2>&1 || true
          "$sdk" --install "ndk;27.0.12077973"

      - id: setup
        uses: ./.github/actions/setup-flutter

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          {
            echo "storeFile=app/release-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # A throwaway version code one past what Play holds, so the upload path
      # can be exercised for real. pubspec.yaml is left alone - this is a test
      # parameter, not a release. Passing it also proves the --build-number
      # channel works now that build.gradle honours it.
      - name: Build App Bundle
        run: flutter build appbundle --release --build-number 108

      # Proves the keystore secrets produced a signed artifact before Play
      # gets a chance to reject it for being unsigned.
      - name: Verify the bundle is signed
        run: |
          jarsigner -verify -verbose:summary build/app/outputs/bundle/release/app-release.aab \
            | tail -5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests

      - name: Dry-run the Play upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python .github/scripts/play_publish.py \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --version-code 108 \
            --track internal
