org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true


# rive_common builds librive_text with NDK 25 unless told otherwise, and NDK 25
# ignores ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES (added in r27), so the library
# came out 4 KB-page aligned, which Google Play rejects. Use the app's NDK.
rive.ndk.version=27.0.12077973
# NDK 27 refuses rive_common's minSdk 19; build its native code for API 21
# (the app's minSdk is 28, so nothing below 21 is ever installed).
android.ndk.suppressMinSdkVersionError=21
